<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIYAD AI AGENCY - Login</title>
    <!-- Supabase ও Tailwind CSS লাইব্রেরি -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- ব্যাকগ্রাউন্ড ডায়নামিক গ্লো ইফেক্ট -->
    <div class="absolute w-96 h-96 bg-purple-600/30 rounded-full blur-3xl -top-20 -left-20 animate-pulse"></div>
    <div class="absolute w-96 h-96 bg-blue-600/30 rounded-full blur-3xl -bottom-20 -right-20 animate-pulse"></div>

    <!-- মূল মর্ডান লগইন কার্ড -->
    <div class="relative z-10 bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md animate-float">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">RIYAD AI AGENCY</h1>
            <p class="text-slate-400 text-sm mt-2">Sign in with Email to access your AI Agents</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-white transition-all" placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-white transition-all" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold rounded-xl shadow-lg transform active:scale-95 transition-all">
                Login / Sign Up
            </button>
        </form>

        <p id="message" class="text-center text-sm mt-4 text-slate-400"></p>
    </div>

    <script>
        // Supabase প্রজেক্টের সঠিক ক্রিপডেনশিয়াল
        const supabaseUrl = 'https://wbcgvywtmnpwxvkdirrb.supabase.co';
        const supabaseKey = 'sb_publishable_U0FEiMvyZg6lvpt4I1ZZg_7KwHDeqf'; 
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            message.textContent = "Processing...";
            message.className = "text-center text-sm mt-4 text-blue-400";
            
            // প্রথমে লগইন করার চেষ্টা করবে
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                // অ্যাকাউন্ট না থাকলে অটো সাইন-আপ করে নেবে
                const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                });
                if (signUpError) {
                    message.textContent = "Error: " + signUpError.message;
                    message.className = "text-center text-sm mt-4 text-red-400";
                } else {
                    message.textContent = "Success! Account created. You can login now.";
                    message.className = "text-center text-sm mt-4 text-green-400";
                }
            } else {
                message.textContent = "Login Successful! Redirecting...";
                message.className = "text-center text-sm mt-4 text-green-400";
                setTimeout(() => {
                    window.location.reload(); // পেজ রিলোড বা ড্যাশবোর্ডে রিডায়রেক্ট করবে
                }, 1200);
            }
        });
    </script>
</body>
</html>
